services:
  app:
    build: .
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://growthifyx:change-me@postgres:5432/growthifyx?schema=public
      SESSION_SECRET: replace-with-at-least-32-random-characters
      APP_URL: http://localhost:3000
      NODE_ENV: development
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-this-before-running-in-production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
  worker:
    build: .
    command: npx tsx worker/index.ts
    environment:
      DATABASE_URL: postgresql://growthifyx:change-me@postgres:5432/growthifyx?schema=public
      SESSION_SECRET: replace-with-at-least-32-random-characters
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: growthifyx
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: growthifyx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthifyx -d growthifyx"]
      interval: 5s
      timeout: 5s
      retries: 10
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
